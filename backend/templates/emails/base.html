<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #0f172a;
            padding: 40px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.025em;
        }
        .content {
            padding: 40px;
            line-height: 1.6;
        }
        .footer {
            background-color: #f1f5f9;
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 24px;
        }
        .highlight {
            color: #3b82f6;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div className="container">
        <div className="header">
            <div className="logo">ATLAS</div>
        </div>
        <div className="content">
            {% block content %}{% endblock %}
        </div>
        <div className="footer">
            <p>&copy; 2026 Atlas SaaS. Todos os direitos reservados.</p>
            <p>Você recebeu este email porque está cadastrado em nossa plataforma.</p>
        </div>
    </div>
</body>
</html>

components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        author_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
        excerpt:
          type: string
          description: Resumo do artigo
        is_published:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
        company:
          type: string
          format: uuid
          readOnly: true
        author:
          type: integer
          readOnly: true
          nullable: true
        category:
          type: integer
          nullable: true
      required:
      - author
      - author_name
      - category_name
      - company
      - content
      - created_at
      - id
      - slug
      - title
      - updated_at
    ArticleRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          minLength: 1
        excerpt:
          type: string
          description: Resumo do artigo
        is_published:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        image:
          type: string
          format: binary
          nullable: true
        category:
          type: integer
          nullable: true
      required:
      - content
      - slug
      - title
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        company:
          type: string
          format: uuid
          readOnly: true
      required:
      - company
      - id
      - name
      - slug
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        branding: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        branding: {}
      required:
      - name
      - slug
    Contact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_online:
          type: string
          readOnly: true
      required:
      - id
      - is_online
      - username
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        participants:
          type: array
          items:
            type: integer
          readOnly: true
        participants_list:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          nullable: true
          maxLength: 255
        is_group:
          type: boolean
        last_message:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - participants
      - participants_list
      - updated_at
    ConversationRequest:
      type: object
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
        is_group:
          type: boolean
    Feature:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - code
      - id
      - name
    License:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        plan:
          type: integer
        plan_name:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date-time
          readOnly: true
        end_date:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
      required:
      - company
      - id
      - plan
      - plan_name
      - start_date
    LicenseRequest:
      type: object
      properties:
        plan:
          type: integer
        end_date:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
      required:
      - plan
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        sender:
          type: integer
          readOnly: true
        sender_username:
          type: string
          readOnly: true
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_read:
          type: boolean
      required:
      - content
      - conversation
      - created_at
      - id
      - sender
      - sender_username
    Module:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        description:
          type: string
        is_default:
          type: boolean
          description: Se ativado por padrão para novas empresas

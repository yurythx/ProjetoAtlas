[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py tests_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# T1: Discover tests in both tests/ subdirectories and module-level test files
testpaths = .

# Always verbose so test names appear in CI output
addopts =
    --reuse-db
    -v
    --tb=short
    --strict-markers

# Register custom markers to avoid PytestUnknownMarkWarning
markers =
    slow: mark test as slow (deselect with '-m "not slow"')
    integration: mark test as integration (requires DB, Redis, etc.)
    websocket: mark test as WebSocket test (requires channels)
    unit: mark test as pure unit test (no DB required)

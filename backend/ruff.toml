# Ruff configuration for Atlas backend
# https://docs.astral.sh/ruff/

# Same as Black's default
line-length = 120

# Target Python 3.12
target-version = "py312"

[lint]
# Rules enabled — start with a practical set, not the kitchen sink
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modernize syntax)
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

ignore = [
    "E501",   # Line too long — handled by formatter
    "B008",   # Do not perform function calls in default arguments (common in Django)
    "B904",   # raise-without-from-inside-except — too strict for Django views
    "N806",   # Variable in function should be lowercase — Django uses Title case often
    "N802",   # Function name should be lowercase — ViewSet methods
    "RUF012", # Mutable class attributes — Django models use this pattern
    "UP007",  # Use X | Y for union types — incompatible with some DRF versions
]

# Allow specific violations in specific files
per-file-ignores = {
    "*/migrations/*.py" = ["E501", "F401", "N"],
    "*/settings*.py" = ["E402", "F401", "F403"],
    "config/asgi.py" = ["E402"],
    "scripts/*.py" = ["E402"],
    "seed_db.py" = ["E402"],
}

[lint.mccabe]
max-complexity = 30

[lint.isort]
known-first-party = ["apps", "shared_kernel", "config"]
known-third-party = ["django", "rest_framework", "celery"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

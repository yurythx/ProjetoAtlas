apiVersion: 1

contactPoints:
  - orgId: 1
    name: Atlas Ops Email
    receivers:
      - uid: atlas-email
        type: email
        settings:
          addresses: "${GRAFANA_ALERT_EMAIL:-ops@example.com}"
          singleEmail: false
        disableResolveMessage: false

  # Uncomment and fill in to enable Slack alerts
  # - orgId: 1
  #   name: Atlas Slack
  #   receivers:
  #     - uid: atlas-slack
  #       type: slack
  #       settings:
  #         url: "${GRAFANA_SLACK_WEBHOOK_URL}"
  #         channel: "#alerts"
  #         username: "Atlas Grafana"
  #         icon_emoji: ":red_circle:"
  #       disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Atlas Ops Email
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

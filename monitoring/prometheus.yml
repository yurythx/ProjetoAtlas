global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: atlas_backend
    static_configs:
      - targets: ['backend:8005']
    metrics_path: /metrics

  - job_name: atlas_postgres
    static_configs:
      - targets: ['pgbouncer:5432']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite 'deploy' para confirmar"
        required: true

# Permissões necessárias para escrever no GHCR
permissions:
  contents: read
  packages: write

jobs:
  # 1. Build and Push to GHCR
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.confirm == 'deploy'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Lowercase repo name for Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/backend:${{ steps.meta.outputs.version }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # Note: Next.js needs build args for public env vars
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.projetoravenna.cloud
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}/frontend:${{ steps.meta.outputs.version }}

  # 2. Deploy to Server
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/atlas' }}
            
            # Exportar variáveis para o docker-compose
            export APP_VERSION=${{ steps.meta.outputs.version }}
            export GITHUB_REPOSITORY=${{ steps.meta.outputs.repo_lower }}
            
            # Login no GHCR no servidor (usando token de curta duração ou PAT)
            # DICA: Para maior segurança, use um Personal Access Token com escopo read:packages
            # ou use o login via SSH de forma transparente se o servidor estiver autorizado.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # O script deploy.sh agora suporta --pull
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh --pull
            
            # Cleanup
            docker image prune -f
            docker logout ghcr.io

      - name: Notificar sucesso
        if: success()
        run: echo "::notice title=Deploy Success::Versão ${{ steps.meta.outputs.version }} deployada via GHCR."

